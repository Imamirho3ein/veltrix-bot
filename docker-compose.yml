services:
  bot:
    build: .
    container_name: veltrix-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Orders, tickets, sessions and CSV exports survive rebuilds.
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
